<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="cs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Outer Ambient Aura -->
    <radialGradient id="cs-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Sphere Surface Lighting -->
    <radialGradient id="cs-sphere" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="22%" stop-color="#8B5CF6" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="85%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Orbital Ring Gradients -->
    <linearGradient id="cs-orbit-back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cs-orbit-front" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Code Slash Gradient -->
    <linearGradient id="cs-slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cs-glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cs-code-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#090D16" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Badge / Container (Pops on both dark and light browser tab themes) -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#cs-bg)" stroke="url(#cs-border)" stroke-width="8" />

  <!-- Ambient Internal Glow behind Sphere -->
  <circle cx="256" cy="256" r="190" fill="url(#cs-aura)" />

  <!-- 3D Orbital Ring (Back Section, passes behind the sphere) -->
  <g transform="rotate(-24 256 256)">
    <path d="M 52 256 A 204 58 0 0 1 460 256" fill="none" stroke="url(#cs-orbit-back)" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.65" />
  </g>

  <!-- Central 3D Sphere -->
  <circle cx="256" cy="256" r="142" fill="url(#cs-sphere)" />

  <!-- Sphere Rim Light Accent -->
  <circle cx="256" cy="256" r="141" fill="none" stroke="#C084FC" stroke-width="2.5" opacity="0.5" />

  <!-- Digital Globe Latitudes & Longitudes (Cybernetic Sphere Structure) -->
  <g transform="rotate(-18 256 256)">
    <!-- Equator -->
    <ellipse cx="256" cy="256" rx="142" ry="46" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 6" opacity="0.35" />
    <!-- Upper Latitude -->
    <ellipse cx="256" cy="204" rx="122" ry="34" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.25" />
    <!-- Lower Latitude -->
    <ellipse cx="256" cy="308" rx="122" ry="34" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.25" />
    <!-- Central Meridian -->
    <ellipse cx="256" cy="256" rx="58" ry="142" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="8 6" opacity="0.2" />
  </g>

  <!-- 3D Orbital Ring (Front Section, sweeps over the front of the sphere) -->
  <g transform="rotate(-24 256 256)">
    <!-- Outer Glow for front ring -->
    <path d="M 52 256 A 204 58 0 0 0 460 256" fill="none" stroke="#818CF8" stroke-width="18" opacity="0.25" stroke-linecap="round" />
    <!-- Main Neon Front Ring -->
    <path d="M 52 256 A 204 58 0 0 0 460 256" fill="none" stroke="url(#cs-orbit-front)" stroke-width="11" stroke-linecap="round" />

    <!-- Orbital Satellite Nodes / Connection Points -->
    <g transform="translate(100, 288)">
      <circle cx="0" cy="0" r="12" fill="#38BDF8" opacity="0.4" />
      <circle cx="0" cy="0" r="8" fill="#38BDF8" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>
    <g transform="translate(385, 276)">
      <circle cx="0" cy="0" r="10" fill="#C084FC" opacity="0.4" />
      <circle cx="0" cy="0" r="7" fill="#C084FC" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- CodeSphere Core Code Brackets & Slash (< / >) -->
  <g filter="url(#cs-code-shadow)">
    <!-- Left Bracket < -->
    <path d="M 196 196 L 148 256 L 196 316" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash / -->
    <path d="M 276 182 L 236 330" fill="none" stroke="url(#cs-slash)" stroke-width="23" stroke-linecap="round" />

    <!-- Right Bracket > -->
    <path d="M 316 196 L 364 256 L 316 316" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Specular Gloss Highlight on Sphere -->
  <ellipse cx="236" cy="165" rx="55" ry="24" fill="#FFFFFF" opacity="0.12" transform="rotate(-15 236 165)" />
</svg>